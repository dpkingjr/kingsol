# Local PostgreSQL for development: `docker compose up -d`
# Matches DATABASE_URL in .env.example.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kingsol
      POSTGRES_PASSWORD: kingsol
      POSTGRES_DB: kingsol
    ports:
      - "54329:5432"
    volumes:
      - kingsol-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kingsol"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  kingsol-pg:

# Kingsol Solitaire at https://davidkingjr.com/kingsol
#
# Paste this location block INSIDE the existing `server { ... }` block for davidkingjr.com
# (the one that already listens on 443 with your TLS certificate), or save it as
# /etc/nginx/snippets/kingsol.conf and add `include /etc/nginx/snippets/kingsol.conf;` there.
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# The app must be configured for the sub-path and listen on 127.0.0.1:3000. On the app server,
# put the base path in .env.production.local (read by both `next build` and `next start`):
#
#     echo 'NEXT_PUBLIC_BASE_PATH=/kingsol' >> .env.production.local
#     npm run build
#     npm start -- -H 127.0.0.1 -p 3000
#
# Matches /kingsol and everything under /kingsol/ (pages, /kingsol/_next/* assets,
# /kingsol/api/* routes) but not unrelated paths such as /kingsolitaire.
location ~ ^/kingsol(/|$) {
    # No URI part on proxy_pass: the /kingsol prefix is passed through unchanged, because the
    # app itself serves everything under /kingsol. Stripping it here would break the app.
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    # The app (and Next.js's Server Actions check) compares the browser's Origin with the host
    # it receives, to refuse cross-site requests: sign-in, admin actions, saves. Forward the
    # public host exactly as the browser sent it. $http_host keeps a non-default port, where
    # $host would drop it and make every such request fail.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header Connection        "";

    # Pages stream in (signed-in parts arrive after the page shell); don't hold them back.
    proxy_buffering off;

    # Saved games with long undo histories can approach 2 MB (nginx's default limit is 1 MB).
    client_max_body_size 3m;

    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    # Cache headers for /kingsol/_next/static/* (immutable, one year) come from the app itself.
}

# Kingsol Solitaire at https://davidkingjr.com/kingsol
#
# INSTALL BY SYMLINK, into a per-site folder (not conf.d)
# --------------------------------------------------------
# This is a `location` block, so it has to load inside the davidkingjr.com `server` block.
# (Files in conf.d load at the http level, where a location isn't allowed, and a second
# server block for the same domain would be ignored as a duplicate.)
#
# 1. Once per server: create a folder for davidkingjr.com's apps and include it from the
#    existing davidkingjr.com `server { ... }` block (the one that listens on 443 with your
#    TLS certificate). Keep this folder OUTSIDE conf.d, or nginx would load it at the http level.
#
#        sudo mkdir -p /etc/nginx/davidkingjr.com.d
#
#        server {
#            server_name davidkingjr.com;
#            ...
#            include /etc/nginx/davidkingjr.com.d/*.conf;   # <- add this line
#        }
#
# 2. Install (or update) Kingsol by symlinking this file into that folder:
#
#        sudo ln -sfn /path/to/kingsol/deploy/nginx/kingsol.conf /etc/nginx/davidkingjr.com.d/kingsol.conf
#        sudo nginx -t && sudo systemctl reload nginx
#
#    To remove it: sudo rm /etc/nginx/davidkingjr.com.d/kingsol.conf, then reload.
#    nginx must be able to read the target (the repo path) for the symlink to work.
#
# The app must be configured for the sub-path and listen on 127.0.0.1:3000:
#   - Docker: KINGSOL_BASE_PATH=/kingsol in the .env next to docker-compose.yml, then
#     `docker compose up -d --build` (publishes 127.0.0.1:3000 by default)
#   - Without Docker: put NEXT_PUBLIC_BASE_PATH=/kingsol in .env.production.local (read by both
#     `next build` and `next start`), then `npm run build && npm start -- -H 127.0.0.1 -p 3000`
#
# Matches /kingsol and everything under /kingsol/ (pages, /kingsol/_next/* assets,
# /kingsol/api/* routes) but not unrelated paths such as /kingsolitaire.
location ~ ^/kingsol(/|$) {
    # No URI part on proxy_pass: the /kingsol prefix is passed through unchanged, because the
    # app itself serves everything under /kingsol. Stripping it here would break the app.
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    # The app (and Next.js's Server Actions check) compares the browser's Origin with the host
    # it receives, to refuse cross-site requests: sign-in, admin actions, saves. Forward the
    # public host exactly as the browser sent it. $http_host keeps a non-default port, where
    # $host would drop it and make every such request fail.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header Connection        "";

    # Pages stream in (signed-in parts arrive after the page shell); don't hold them back.
    proxy_buffering off;

    # Saved games with long undo histories can approach 2 MB (nginx's default limit is 1 MB).
    client_max_body_size 3m;

    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    # Cache headers for /kingsol/_next/static/* (immutable, one year) come from the app itself.
}
